name: tests

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - "skills_tracker/**"
      - "tests/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest
